palette = 'onedark'

[line_break]
disabled = true

[directory.substitutions]
'Documents' = '󰈙'
'Downloads' = ' '
'Pictures' = ' '
'adad_projects' = '󰯫󰯴󰯫󰯴 󱛠 '

[directory]
style = 'bold fg:dark_blue'
format = '[$path ]($style)'
truncation_length = 2
truncation_symbol = '…/'
truncate_to_repo = false

[git_status]
style = 'fg:green'
format = '([$all_status$ahead_behind]($style) )'

[aws]
format = '(on [$symbol$profile]($style) )'
style = 'yellow'
symbol = ' '
[aws.profile_aliases]
default ='DEV/STAGING'
adad-uat ='UAT'
adad-prod ='PROD'

[lua]
format = '[$symbol($version )]($style)'
symbol = ' '

[palettes.nord]
dark_blue = '#5E81AC'
blue = '#81A1C1'
teal = '#88C0D0'
red = '#BF616A'
orange = '#D08770'
green = '#A3BE8C'
yellow = '#EBCB8B'
purple = '#B48EAD'
gray = '#434C5E'
black = '#2E3440'
white='#D8DEE9'

[palettes.onedark]
dark_blue='#61afef'
blue='#56b6c2'
red='#e06c75'
green='#98c379'
purple='#c678dd'
cyan='#56b6c2'
